<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Today's Deals — Velora</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>

<div class="container">
  <div class="deal-hero">
    <h2 style="color:#fff; font-size:2rem;">⚡ Flash Sale — Up to 35% Off</h2>
    <p style="color:rgba(255,255,255,.85);">Deep discounts on top picks. Grab them before the timer runs out.</p>
    <div class="countdown" id="countdown">
      <div><div class="num" id="cd-hours">00</div><div class="lbl">Hours</div></div>
      <div><div class="num" id="cd-mins">00</div><div class="lbl">Minutes</div></div>
      <div><div class="num" id="cd-secs">00</div><div class="lbl">Seconds</div></div>
    </div>
  </div>
</div>

<section class="section" style="padding-top:10px;">
  <div class="container">
    <div class="section-head">
      <div><h2>Flash Sale Products</h2><p>Discount of 25% or more, for a limited time only.</p></div>
    </div>
    <div class="product-grid" id="flash-sale-grid"></div>
  </div>
</section>

<section class="section" style="background:var(--surface);">
  <div class="container">
    <div class="section-head">
      <div><h2>More Limited-Time Offers</h2><p>Great prices while stock lasts.</p></div>
    </div>
    <div class="product-grid" id="other-deals-grid"></div>
  </div>
</section>

<div id="site-footer"></div>

<script src="js/products.js"></script>
<script src="js/app.js"></script>
<script>
  renderShell("deals");

  const flash = PRODUCTS.filter(p => p.discount >= 25).sort((a, b) => b.discount - a.discount);
  const others = PRODUCTS.filter(p => p.discount >= 15 && p.discount < 25);
  renderProductGrid("flash-sale-grid", flash);
  renderProductGrid("other-deals-grid", others);

  // Countdown resets every 6 hours from a fixed anchor so it feels persistent across reloads
  function updateCountdown() {
    const now = new Date();
    const cycleMs = 6 * 60 * 60 * 1000;
    const msIntoCycle = now.getTime() % cycleMs;
    const msLeft = cycleMs - msIntoCycle;
    const h = Math.floor(msLeft / 3600000);
    const m = Math.floor((msLeft % 3600000) / 60000);
    const s = Math.floor((msLeft % 60000) / 1000);
    document.getElementById("cd-hours").textContent = String(h).padStart(2, "0");
    document.getElementById("cd-mins").textContent = String(m).padStart(2, "0");
    document.getElementById("cd-secs").textContent = String(s).padStart(2, "0");
  }
  updateCountdown();
  setInterval(updateCountdown, 1000);
</script>
</body>
</html>
