<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Velora</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>

<div class="auth-wrap">
  <div class="form-card">
    <h2 style="text-align:center;">Welcome back</h2>
    <p style="text-align:center;">Log in to track orders, manage your wishlist, and check out faster.</p>
    <form id="login-form" novalidate>
      <div class="form-field">
        <label>Email</label>
        <input type="email" id="login-email" required>
        <div class="field-error">Enter a valid email address.</div>
      </div>
      <div class="form-field">
        <label>Password</label>
        <input type="password" id="login-password" required>
        <div class="field-error">Please enter your password.</div>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Log In</button>
    </form>
    <div class="auth-switch">New to Velora? <a href="register.html">Create an account</a></div>
  </div>
</div>

<div id="site-footer"></div>

<script src="js/products.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
<script>
  renderShell("shop");
</script>
</body>
</html>
