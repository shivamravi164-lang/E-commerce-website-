<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — Velora</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>

<div class="auth-wrap">
  <div class="form-card">
    <h2 style="text-align:center;">Create your account</h2>
    <p style="text-align:center;">Join Velora for faster checkout and order tracking.</p>
    <form id="register-form" novalidate>
      <div class="form-field">
        <label>Full Name</label>
        <input type="text" id="reg-name" required>
        <div class="field-error">Please enter your full name.</div>
      </div>
      <div class="form-field">
        <label>Email</label>
        <input type="email" id="reg-email" required>
        <div class="field-error">Enter a valid email address.</div>
      </div>
      <div class="form-field">
        <label>Mobile Number</label>
        <input type="tel" id="reg-mobile" required>
        <div class="field-error">Enter a valid 10-digit mobile number.</div>
      </div>
      <div class="form-field">
        <label>Password</label>
        <input type="password" id="reg-password" required>
        <div class="field-error">Password must be at least 6 characters.</div>
      </div>
      <div class="form-field">
        <label>Confirm Password</label>
        <input type="password" id="reg-confirm" required>
        <div class="field-error">Passwords do not match.</div>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Create Account</button>
    </form>
    <div class="auth-switch">Already have an account? <a href="login.html">Log in</a></div>
  </div>
</div>

<div id="site-footer"></div>

<script src="js/products.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
<script>
  renderShell("shop");
</script>
</body>
</html>
